[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mir-core"
version = "0.2.0"
requires-python = ">=3.10"
description = "Shared Python package for MSc thesis MIR project"
license-files = ["third_party/madmom-NOTICE.md"]

[project.optional-dependencies]
native = [
  "onnx>=1.16",
  "onnxruntime>=1.20",
]

[tool.setuptools.packages.find]
include = ["mir_core*", "mir_env*"]

[tool.setuptools.package-data]
"mir_core.checkpoints" = ["trained/**/*.pt", "trained/**/*.json", "trained/**/*.md"]
"mir_core.checkpoints.beatnet" = ["*.pt", "*.md"]
"mir_core.checkpoints.beatnet_plus" = ["*.pt", "*.md"]
"mir_core.checkpoints.beast" = ["*.pt", "*.md"]
"mir_core.checkpoints.bocktcn" = ["*.pkl", "*.md"]
