name: Native DSP port parity

on:
  pull_request:
    paths: ['native-dsp/**', '.github/workflows/native-dsp-parity.yml']
  push:
    branches: [main]
    paths: ['native-dsp/**', '.github/workflows/native-dsp-parity.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-cpp-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install the declared reference and Rust toolchain
        run: |
          python -m pip install numpy==1.26.4 soxr==0.5.0.post1
          rustup toolchain install 1.88.0 --profile minimal
      - name: Build both interfaces
        run: |
          cmake -S native-dsp -B native-dsp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native-dsp/build --parallel 2
          cargo +1.88.0 build --manifest-path native-dsp/rust/Cargo.toml --locked --release --examples
      - name: Compare samples, rates, chunks, flush and reset
        run: |
          python native-dsp/tools/resampling_parity.py \
            --cpp-replay native-dsp/build/mir_resampler_replay \
            --rust-replay native-dsp/rust/target/release/examples/resampler_replay \
            --library native-dsp/build/libmir_dsp.so \
            --output native-dsp/build/port-parity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-dsp-parity
          path: native-dsp/build/port-parity.json
