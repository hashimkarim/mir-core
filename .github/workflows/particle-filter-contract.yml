name: Historical and portable particle-filter contract

on:
  pull_request:
  push:
    branches: [main, fix/ports-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-and-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install the frozen historical reference
        run: |
          python -m pip install -r tests/requirements-pf-contract.txt
          python -m pip install --no-build-isolation 'git+https://github.com/CPJKU/madmom.git@27f032e8947204902c675e5e341a3faf5dc86dae'
      - name: Check both generators and shared state updates
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q tests/test_postprocessing_particle_filter.py tests/test_particle_filter_rng_contract.py -k 'not test_frozen_dual_rng_manifest'
          python -m mir_core.testing.particle_filter_contract --output build/pf-contract.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: particle-filter-rng-contract
          path: build/pf-contract.json
